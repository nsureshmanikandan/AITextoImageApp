version: '3.9'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/media:/app/media
      - ./backend/vernacularcast.db:/app/vernacularcast.db
    env_file: .env
    environment:
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - LOCAL_MEDIA_DIR=/app/media
    deploy:
      replicas: 2   # horizontal scaling
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - vernacularcast

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vernacularcast

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - vernacularcast

networks:
  vernacularcast:
    driver: bridge

volumes:
  media_data:
